name: CI

on:
  push:
    branches: [main, next]
    tags-ignore:
      - "v*"
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main, next]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: server/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type check, lint & format check
        run: pnpm check

      - name: Test
        run: pnpm test

  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: server/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: E2E tests (testcontainers Postgres)
        run: pnpm test:e2e

  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Design tokens match the generated files
        run: node ../design/build/build.mjs --check

      - name: Lint & format check
        run: pnpm check

      - name: Test
        run: pnpm test

  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: false
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,prefix=
        type=raw,value=latest,enable={{is_default_branch}}

  convex-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: convex-backend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: convex-backend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: convex-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p convex/tsconfig.json
      - name: Run contracts against self-hosted Convex
        run: bash e2e/self-hosted-contracts.sh 2>&1 | tee convex-contract.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: convex-contract
          path: convex-backend/convex-contract.log

  compose-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: mobile-kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: convex-backend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: convex-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: convex-backend
      - run: sdkmanager 'platforms;android-37.0'
      - name: Build the APK and verify the Room upgrade
        run: |
          bash e2e/room-upgrade-host.sh :androidApp:assembleDebug
          python3 e2e/verify-anchor-fonts.py androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - name: Prepare the Android emulator and codec verifier
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager emulator 'system-images;android-35;google_apis;x86_64'
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Run Compose migration and media checks against self-hosted Convex
        run: |
          status=0
          for suite in migration media; do
            mkdir -p "android-e2e/$suite"
            if ! bash ../convex-backend/e2e/self-hosted-contracts.sh --native-command \
              bash "$PWD/e2e/android-board-ci.sh" "$PWD/android-e2e/$suite" "$suite" \
              2>&1 | tee "android-e2e/$suite/run.log"; then
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: compose-android
          path: |
            mobile-kotlin/androidApp/build/outputs/apk/debug/*.apk
            mobile-kotlin/shared/build/test-results/testAndroidHostTest/*.xml
            mobile-kotlin/android-e2e/

  compose-ios:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: mobile-kotlin/iosApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: convex-backend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: convex-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: convex-backend
      - run: brew install xcodegen
      - name: Build the simulator app and its share extension
        run: |
          xcodegen generate
          xcodebuild -project AnchorIOS.xcodeproj -scheme AnchorIOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -resultBundlePath AnchorIOS.xcresult ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
          test -d build/Build/Products/Debug-iphonesimulator/AnchorIOS.app/PlugIns/AnchorShareExtension.appex
          python3 ../e2e/verify-anchor-fonts.py build/Build/Products/Debug-iphonesimulator/AnchorIOS.app
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/AnchorIOS.app AnchorIOS-simulator.zip
      - name: Build and check the iOS release app and share extension
        run: |
          xcodebuild -project AnchorIOS.xcodeproj -scheme AnchorIOS -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -resultBundlePath AnchorIOS-Release.xcresult ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
          app=build/Build/Products/Release-iphonesimulator/AnchorIOS.app
          python3 ../e2e/verify-ios-release.py "$app" Generated --platform iPhoneSimulator | tee ios-release-check.json
      - name: Build and check the unsigned iOS device app and share extension
        run: |
          xcodebuild -project AnchorIOS.xcodeproj -scheme AnchorIOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            -resultBundlePath AnchorIOS-Device.xcresult CODE_SIGNING_ALLOWED=NO build
          app=build/Build/Products/Release-iphoneos/AnchorIOS.app
          python3 ../e2e/verify-ios-release.py "$app" Generated --platform iPhoneOS | tee ios-device-check.json
          python3 ../e2e/verify-anchor-fonts.py "$app"
      - name: Launch Compose in an iPhone simulator
        run: |
          device="$(xcrun simctl list devices available -j | jq -er '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/AnchorIOS.app
          xcrun simctl launch "$device" com.zhfahim.anchor.compose | tee ios-launch.txt
      - name: Verify note and share round trips in the iOS simulator
        shell: bash
        working-directory: mobile-kotlin
        run: |
          fixture="$RUNNER_TEMP/anchor-convex"
          mkdir -p "$fixture"
          release=precompiled-2026-11-21-cf39368
          asset=convex-local-backend-aarch64-apple-darwin.zip
          curl --fail --silent --show-error --location \
            "https://github.com/convex/convex-backend/releases/download/$release/$asset" \
            --output "$fixture/$asset"
          printf '%s  %s\n' 32530173dcd215b16e296a09f07e17e71f41f3b261136c8469fcb76af6445119 "$fixture/$asset" \
            | shasum -a 256 --check
          unzip -q "$fixture/$asset" -d "$fixture"
          chmod +x "$fixture/convex-local-backend"
          bash ../convex-backend/e2e/local-compose-fixture.sh "$fixture/convex-local-backend" \
            ./gradlew :shared:iosSimulatorArm64Test --console=plain 2>&1 | tee ios-roundtrip.log
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = Path("shared/build/test-results/iosSimulatorArm64Test").glob("TEST-*.xml")
          cases = [case for file in reports for case in ElementTree.parse(file).iter("testcase")]
          for name in (
              "formattedNoteRoundTripsThroughConvexAndSurvivesRoomReopen",
              "sharedNoteAndAttachmentSurviveRoomReopenAndReachConvexOnce",
          ):
              matches = [case for case in cases if case.get("name", "").split("[", 1)[0] == name]
              assert len(matches) == 1, f"{name} did not run exactly once"
              assert not any(child.tag in {"error", "failure", "skipped"} for child in matches[0]), f"{name} did not pass"
          PY
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: compose-ios
          path: |
            mobile-kotlin/iosApp/AnchorIOS-simulator.zip
            mobile-kotlin/iosApp/AnchorIOS.xcresult
            mobile-kotlin/iosApp/AnchorIOS-Release.xcresult
            mobile-kotlin/iosApp/AnchorIOS-Device.xcresult
            mobile-kotlin/iosApp/ios-release-check.json
            mobile-kotlin/iosApp/ios-device-check.json
            mobile-kotlin/iosApp/ios-launch.txt
            mobile-kotlin/ios-roundtrip.log
            mobile-kotlin/shared/build/test-results/iosSimulatorArm64Test/
