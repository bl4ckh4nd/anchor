name: Docker Build

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the image to the registry
        required: true
        type: boolean
      tags:
        description: Docker metadata tags configuration
        required: true
        type: string
      target:
        description: Dockerfile stage to build
        type: string
        default: runner

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}${{ inputs.target == 'convex_web' && '-web' || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: anchor:test
          cache-from: type=gha,scope=${{ inputs.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}-${{ matrix.arch }}

      - name: Test legacy image
        if: inputs.target == 'runner'
        run: sh docker/test-image.sh anchor:test

      - uses: pnpm/action-setup@v6
        if: inputs.target == 'convex_web'
        with:
          package_json_file: convex-backend/package.json

      - uses: actions/setup-node@v7
        if: inputs.target == 'convex_web'
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: convex-backend/pnpm-lock.yaml

      - name: Test Web image against self-hosted Convex
        if: inputs.target == 'convex_web'
        run: |
          pnpm --dir convex-backend install --frozen-lockfile
          export ANCHOR_TEST_RELEASE_ARTIFACT="$RUNNER_TEMP/anchor-web-image"
          export ANCHOR_CONVEX_WEB_PORT=3735
          mkdir -p "$ANCHOR_TEST_RELEASE_ARTIFACT"
          ANCHOR_CONVEX_WEB_IMAGE=anchor:test bash convex-backend/e2e/self-hosted-contracts.sh --native-command \
            env ANCHOR_CONVEX_SITE_PORT="$ANCHOR_CONVEX_WEB_PORT" \
            node e2e/copy-undo.mjs "$ANCHOR_TEST_RELEASE_ARTIFACT/copy-undo.json"

      - name: Set image name
        if: inputs.push
        run: echo "IMAGE=$REGISTRY/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Push image by digest
        id: build
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ inputs.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      - name: Create multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGE="$REGISTRY/${IMAGE_NAME,,}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
