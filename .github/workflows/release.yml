name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        target: [runner, convex_web]
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      target: ${{ matrix.target }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
        type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
        type=raw,value=next,enable=${{ contains(github.ref, '-') }}

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mobile-kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build and verify the signed Compose APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANCHOR_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANCHOR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANCHOR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANCHOR_ANDROID_STORE_PASSWORD"
          test -n "$ANCHOR_ANDROID_KEY_PASSWORD"
          test -n "$ANCHOR_ANDROID_KEY_ALIAS"
          umask 077
          export ANCHOR_ANDROID_KEYSTORE="$(mktemp)"
          trap 'rm -f -- "$ANCHOR_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANCHOR_ANDROID_KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          version="${GITHUB_REF_NAME#v}"
          ./gradlew :androidApp:assembleRelease -PanchorSplitApks "-PanchorVersion=$version"
          mkdir release-apks
          for abi in universal armeabi-v7a arm64-v8a x86_64; do
            apk="androidApp/build/outputs/apk/release/androidApp-$abi-release.apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            suffix="-$abi"
            if [[ "$abi" == universal ]]; then suffix=; fi
            cp "$apk" "release-apks/anchor-$version$suffix.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mobile-kotlin/release-apks/anchor-*.apk

  create-release:
    runs-on: ubuntu-latest
    needs: [docker, build-android]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts

      - name: Generate Release Notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configuration: ".github/release-config.json"
          outputFile: release-notes.md
          ignorePreReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            artifacts/anchor-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
