name: anchor-convex

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: convex
      POSTGRES_DB: ${ANCHOR_CONVEX_INSTANCE_NAME:-anchor_convex}
      POSTGRES_PASSWORD: ${ANCHOR_CONVEX_PG_PASSWORD:?Set ANCHOR_CONVEX_PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "convex", "-d", "${ANCHOR_CONVEX_INSTANCE_NAME:-anchor_convex}"]
      interval: 2s
      timeout: 3s
      retries: 30

  convex:
    image: ghcr.io/convex/convex-backend@sha256:e9c084e8bd6c1f249012c672193f0988c748824f55a24cdad45f6185a8462f9a
    stop_signal: SIGINT
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INSTANCE_NAME: ${ANCHOR_CONVEX_INSTANCE_NAME:-anchor_convex}
      INSTANCE_SECRET: ${ANCHOR_CONVEX_INSTANCE_SECRET:?Set ANCHOR_CONVEX_INSTANCE_SECRET}
      POSTGRES_URL: postgresql://convex:${ANCHOR_CONVEX_PG_PASSWORD}@postgres:5432
      DO_NOT_REQUIRE_SSL: "1"
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:${ANCHOR_CONVEX_API_PORT:-3640}
      CONVEX_SITE_ORIGIN: http://127.0.0.1:${ANCHOR_CONVEX_SITE_PORT:-3641}
      DISABLE_BEACON: "true"
    ports:
      - "127.0.0.1:${ANCHOR_CONVEX_API_PORT:-3640}:3210"
      - "127.0.0.1:${ANCHOR_CONVEX_SITE_PORT:-3641}:3211"
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3210/version"]
      interval: 3s
      timeout: 3s
      retries: 30


  web:
    profiles: [release]
    image: ${ANCHOR_CONVEX_WEB_IMAGE:-anchor-convex-web:local}
    build:
      context: .
      target: convex_web
      args:
        SERVER_URL: http://convex:3211
    depends_on:
      convex:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ANCHOR_CONVEX_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r => { if (!r.ok || (await r.json()).app !== 'anchor') process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 3s
      timeout: 5s
      retries: 25

volumes:
  postgres-data:
  convex-data:
